# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build
      run: swift build -v
      
    - name: Run Tests with Coverage
      run: swift test -v --parallel --enable-code-coverage

    - name: Export Coverage Report
      run: |
        BIN_PATH=$(swift build --show-bin-path)
        xcrun llvm-cov export \
          --format=lcov \
          --instr-profile="${BIN_PATH}/codecov/default.profdata" \
          --ignore-filename-regex="\\.build|Tests" \
          "${BIN_PATH}/OrTests.xctest/Contents/MacOS/OrTests" \
          > coverage.lcov

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.lcov
        fail_ci_if_error: false

    - name: Test Summary
      run: |
        echo "✅ All tests completed successfully!"
      if: success()
      
    - name: Test Failure Report
      run: |
        echo "❌ Tests failed. Please check the test output above for details."
      if: failure()
